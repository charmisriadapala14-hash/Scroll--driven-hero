<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scroll Driven Hero</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HERO SECTION -->
  <section class="hero">

    <div class="content">

      <p class="small-text">
        SCROLL-DRIVEN EXPERIENCE
      </p>

      <h1>
        W E L C O M E<br>
        I T Z F I Z Z
      </h1>

      <!-- STATISTICS -->
      <div class="stats">

        <div class="stat">
          <h2>58%</h2>
          <p>Increase in customer engagement</p>
        </div>

        <div class="stat">
          <h2>23%</h2>
          <p>Decrease in customer calls</p>
        </div>

        <div class="stat">
          <h2>27%</h2>
          <p>Increase in usage</p>
        </div>

        <div class="stat">
          <h2>40%</h2>
          <p>Improvement in experience</p>
        </div>

      </div>

    </div>

    <!-- MAIN VISUAL -->
    <div class="car">
      🚗
    </div>

    <p class="scroll-text">
      SCROLL ↓
    </p>

  </section>


  <!-- SECOND SECTION -->
  <section class="second-section">

    <h2>Keep Scrolling</h2>

    <p>
      Smooth scroll-driven animation using
      HTML, CSS and JavaScript.
    </p>

  </section>


  <script src="script.js"></script>

</body>
</html>
